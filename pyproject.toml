[project]
name = "aegis-ai"
version = "0.1.0"
description = "Project Aegis AI: a secure, modular multi-agent platform (paper/demo-first)."
readme = "README.md"
requires-python = ">=3.13"
# Runtime deps are pinned exactly; every addition must be recorded in
# docs/DEPENDENCIES.md with provenance, license and review notes.
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
# Windows-only: the official MetaTrader5 wheel is published for win_amd64 only.
mt5 = ["MetaTrader5==5.0.6231; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
    "mypy==1.18.2",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: test performs real outbound network calls (opt-in via AEGIS_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.build-backend]
module-name = "aegis"
